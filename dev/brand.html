<!doctype html>
<html><head><meta charset="utf-8"><title>Brand renders</title>
<style>
html,body{margin:0;background:transparent}
#s{position:relative;overflow:hidden}
#s svg{display:block;width:100%;height:100%}
</style></head><body><div id="s"></div>
<script type="module">
/*
 * Jjak brand renders: app icon layers, splash screens and store icon.
 *   ?size=px            output square size
 *   &seal=px            seal side in px (0 = no seal, e.g. the adaptive background)
 *   &bg=paper|ink|      background ('' = transparent, e.g. the adaptive foreground)
 *   &word=Jjak          wordmark + bilingual line under the seal (splash)
 *   &shadow=0           suppress the seal's soft shadow
 * Everything is vector paths and gradients (no filters) so it stays crisp and fast.
 */
import '../src/styles/fonts.css';

const q = new URLSearchParams(location.search);
const size = +q.get('size') || 1024;
const sealPx = +q.get('seal') || 0;
const bg = q.get('bg') || '';
const word = q.get('word') || '';
const shadow = q.get('shadow') !== '0';

const PAPER = '#f3ecdf', INK = '#1c1b19', VERMILION = '#c4472f', SEAL_TEXT = '#fbf5ea';
const n = (v) => Math.round(v * 100) / 100;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/** Points around a rounded square (half-size h, corner radius r), clockwise from the top edge. */
function roundRect(h, r, step) {
  const pts = [];
  const edge = (x0, y0, x1, y1) => { const L = Math.hypot(x1 - x0, y1 - y0), k = Math.max(1, Math.round(L / step)); for (let i = 0; i < k; i++) pts.push([x0 + (x1 - x0) * i / k, y0 + (y1 - y0) * i / k, (y1 - y0) / L, -(x1 - x0) / L]); };
  const arc = (cx, cy, a0) => { const k = Math.max(2, Math.round(r * Math.PI / 2 / step)); for (let i = 0; i < k; i++) { const a = a0 + (Math.PI / 2) * i / k; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.cos(a), Math.sin(a)]); } };
  edge(-h + r, -h, h - r, -h); arc(h - r, -h + r, -Math.PI / 2);
  edge(h, -h + r, h, h - r); arc(h - r, h - r, 0);
  edge(h - r, h, -h + r, h); arc(-h + r, h - r, Math.PI / 2);
  edge(-h, h - r, -h, -h + r); arc(-h + r, -h + r, Math.PI);
  return pts;
}
const blob = (x, y, r, rr) => { let d = ''; const k = 7; for (let i = 0; i <= k; i++) { const a = i / k * Math.PI * 2, R = r * (0.7 + rr() * 0.5); d += `${i ? 'L' : 'M'}${n(x + Math.cos(a) * R)} ${n(y + Math.sin(a) * R)}`; } return d + 'Z'; };

/**
 * The seal in a -50..50 box: vermilion stamp with a hand-cut edge, an inner border broken by a
 * small plum blossom, intaglio 짝 and the speckle of a real impression.
 */
function seal(id) {
  const r = rng(7);
  // outer edge: low-frequency wobble plus a few nicks
  const ph = [r() * 6, r() * 6, r() * 6];
  const out = roundRect(46, 13, 1.2).map(([x, y, nx, ny], i) => {
    const t = i / 40;
    let o = 0.45 * Math.sin(t * 3.1 + ph[0]) + 0.3 * Math.sin(t * 7.3 + ph[1]) + 0.18 * Math.sin(t * 17 + ph[2]) + (r() - 0.5) * 0.12;
    if (r() < 0.012) o -= 0.25 + r() * 0.35;
    return [x + nx * o, y + ny * o];
  });
  const outer = out.map(([x, y], i) => `${i ? 'L' : 'M'}${n(x)} ${n(y)}`).join('') + 'Z';
  // inner border with a gap at the top-right corner for the blossom
  const inner = roundRect(37.5, 7.5, 0.8).map(([x, y, nx, ny]) => [x + nx * (r() - 0.5) * 0.35, y + ny * (r() - 0.5) * 0.35]);
  const gap = ([x, y]) => Math.hypot(x - 33.6, y + 33.6) < 9.5;
  let border = '', pen = false;
  const start = inner.findIndex((p) => gap(p) && !gap(inner[(inner.indexOf(p) + 1) % inner.length]));
  for (let k = 1; k <= inner.length; k++) {
    const p = inner[(start + k) % inner.length];
    if (gap(p)) { pen = false; continue; }
    border += `${pen ? 'L' : 'M'}${n(p[0])} ${n(p[1])}`; pen = true;
  }
  let petals = '';
  for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; petals += `<circle cx="${n(33.6 + Math.cos(a) * 2.9)}" cy="${n(-33.6 + Math.sin(a) * 2.9)}" r="2.5"/>`; }
  // impression texture
  let voids = '', thin = '', glyphSpeck = '';
  for (let k = 0; k < 44; k++) {
    const a = r() * Math.PI * 2, d = 38 + r() * 9;
    const x = Math.max(-46, Math.min(46, Math.cos(a) * d * 1.15)), y = Math.max(-46, Math.min(46, Math.sin(a) * d * 1.15));
    voids += blob(x, y, 0.2 + r() * 0.55, r);
  }
  for (let k = 0; k < 10; k++) voids += blob(-40 + r() * 80, -40 + r() * 80, 0.2 + r() * 0.35, r);
  for (let k = 0; k < 7; k++) thin += `<ellipse cx="${n(-30 + r() * 60)}" cy="${n(-30 + r() * 60)}" rx="${n(8 + r() * 14)}" ry="${n(5 + r() * 9)}" transform="rotate(${Math.round(r() * 180)})"/>`;
  for (let k = 0; k < 18; k++) glyphSpeck += blob(-22 + r() * 44, -24 + r() * 46, 0.2 + r() * 0.35, r);
  return `
  <defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cf5338"/><stop offset=".55" stop-color="${VERMILION}"/><stop offset="1" stop-color="#b13c27"/></linearGradient>
    <clipPath id="${id}c"><path d="${outer}"/></clipPath>
  </defs>
  <path d="${outer}" fill="url(#${id}g)"/>
  <g clip-path="url(#${id}c)">
    <g fill="#9f321f" opacity=".07">${thin}</g>
  </g>
  <path d="${border}" fill="none" stroke="${SEAL_TEXT}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <g fill="${SEAL_TEXT}" opacity=".95">${petals}</g><circle cx="33.6" cy="-33.6" r="1.25" fill="#e7b04f"/>
  <text x="0" y="1.5" text-anchor="middle" dominant-baseline="central" font-family="'Gowun Batang', serif" font-weight="700" font-size="60"
    fill="${SEAL_TEXT}" stroke="${SEAL_TEXT}" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke">짝</text>
  <path d="${glyphSpeck}" fill="${VERMILION}" opacity=".4"/>
  <path d="${voids}" fill="${SEAL_TEXT}" opacity=".5"/>`;
}

/** Paper (or ink) ground with fibres and a soft vignette; all in a 0..1000 box. */
function ground(kind) {
  const r = rng(kind === 'ink' ? 31 : 17);
  const [c0, c1, fibre, fop] = kind === 'ink' ? ['#25231f', '#161513', '#3a3631', 0.5] : ['#f8f2e7', '#ece1cd', '#c9b994', 0.3];
  let f = '';
  for (let k = 0; k < 260; k++) {
    const x = r() * 1000, y = r() * 1000, len = 6 + r() * 26, a = r() * Math.PI;
    const bx = x + Math.cos(a) * len, by = y + Math.sin(a) * len, cx = (x + bx) / 2 + (r() - 0.5) * 8, cy = (y + by) / 2 + (r() - 0.5) * 8;
    f += `M${n(x)} ${n(y)}Q${n(cx)} ${n(cy)} ${n(bx)} ${n(by)}`;
  }
  let flecks = '';
  for (let k = 0; k < 60; k++) flecks += blob(r() * 1000, r() * 1000, 0.8 + r() * 1.8, r);
  return `
  <defs><radialGradient id="gr${kind}" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></radialGradient></defs>
  <rect width="1000" height="1000" fill="url(#gr${kind})"/>
  <path d="${f}" stroke="${fibre}" stroke-width="1.1" fill="none" opacity="${fop}" stroke-linecap="round"/>
  <path d="${flecks}" fill="${fibre}" opacity="${fop * 0.8}"/>`;
}

/** Faint ink-wash ridges along the bottom of the splash. */
function ridges(kind) {
  const tones = kind === 'ink' ? ['#211f1c', '#262420', '#2b2824'] : ['#ebe1d0', '#e3d6c1', '#dacbb3'];
  let out = '';
  [[790, 34, 1.3], [850, 26, 2.1], [915, 20, 3.4]].forEach(([base, amp, f], i) => {
    let d = 'M-10 1010';
    for (let x = -10; x <= 1010; x += 10) d += `L${x} ${n(base - amp * (Math.sin(x / 160 * f + i * 2) * 0.7 + Math.sin(x / 61 + i) * 0.3) - (i === 0 ? 40 * Math.exp(-(((x - 700) / 120) ** 2)) : 0))}`;
    out += `<path d="${d}L1010 1010Z" fill="${tones[i]}"/>`;
  });
  return out;
}

const s = document.getElementById('s');
s.style.width = s.style.height = size + 'px';
const u = sealPx / size * 1000; // seal side in viewBox units
let svg = `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">`;
// Splash: flat ground matching the native splash colour (seamless letterboxing, small PNGs) + ridges.
if (bg && word) svg += `<rect width="1000" height="1000" fill="${bg === 'ink' ? INK : PAPER}"/>` + ridges(bg);
else if (bg) svg += ground(bg);
if (u) {
  const cy = word ? 430 : 500;
  if (shadow) {
    svg += `<defs><radialGradient id="sh"><stop offset="0" stop-color="#4a1e12" stop-opacity="${bg === 'ink' ? 0.5 : 0.26}"/><stop offset="1" stop-color="#4a1e12" stop-opacity="0"/></radialGradient></defs>`;
    svg += `<ellipse cx="500" cy="${n(cy + u * 0.07)}" rx="${n(u * 0.62)}" ry="${n(u * 0.6)}" fill="url(#sh)"/>`;
  }
  svg += `<g transform="translate(500 ${cy}) rotate(-5) scale(${n(u / 100)})">${seal('se')}</g>`;
  if (word) {
    const ink = bg === 'ink' ? '#eee6d7' : '#2a2724', soft = bg === 'ink' ? '#a59c8e' : '#6e665c';
    svg += `<text x="500" y="${n(cy + u * 0.5 + 118)}" text-anchor="middle" font-family="'Gowun Batang', serif" font-weight="700" font-size="${n(u * 0.42)}" fill="${ink}" letter-spacing="2">${word}</text>`;
    svg += `<text x="500" y="${n(cy + u * 0.5 + 186)}" text-anchor="middle" font-size="${n(u * 0.13)}" fill="${soft}" letter-spacing="3"><tspan font-family="'Gowun Batang', serif">꽃을 맞추다</tspan><tspan dx="10" fill="${VERMILION}">·</tspan><tspan dx="10" font-family="'Zen Old Mincho', serif">花を合わせる</tspan></text>`;
  }
}
svg += '</svg>';
s.innerHTML = svg;
await Promise.all([
  document.fonts.load("700 60px 'Gowun Batang'", '짝Jjak'),
  document.fonts.load("400 60px 'Gowun Batang'", '꽃을 맞추다'),
  document.fonts.load("400 60px 'Zen Old Mincho'", '花を合わせる'),
]);
await document.fonts.ready;
document.body.dataset.ready = '1';
</script></body></html>
